<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proyectos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">

        <div class="d-flex justify-content-end mb-3">

            <button class="btn btn-danger" id="btnLogout">

                Cerrar Sesión

            </button>

        </div>

        <h1 class="text-center mb-4">
            Gestión de Proyectos
        </h1>

        <div class="text-center mb-4">


            <a href="index.html" class="btn btn-primary">
                Proyectos
            </a>

            <a href="tareas.html" class="btn btn-success">
                Tareas
            </a>

        </div>

        <div class="card p-4">

            <input type="hidden" id="proyectoId">

            <input type="text" id="nombre" class="form-control mb-3" placeholder="Nombre del proyecto">

            <textarea id="descripcion" class="form-control mb-3" placeholder="Descripción"></textarea>

            <button class="btn btn-primary" id="btnGuardar">

                Guardar Proyecto

            </button>

        </div>

        <hr>

        <table class="table table-bordered">

            <thead>

                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody id="listaProyectos">

            </tbody>

        </table>

    </div>

    <script type="module" src="js/proyecto.js"></script>

</body>

</html>
