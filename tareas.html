<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Gestión de Tareas
        </h1>

        <div class="text-center mb-4">

            <a href="index.html" class="btn btn-primary">
                Proyectos
            </a>

            <a href="tareas.html" class="btn btn-success">
                Tareas
            </a>

        </div>

        <div class="card p-4">

            <input type="hidden" id="tareaId">

            <input type="text" id="titulo" class="form-control mb-3" placeholder="Título de la tarea">

            <textarea id="descripcionTarea" class="form-control mb-3" placeholder="Descripción de la tarea"></textarea>

            <select id="estado" class="form-control mb-3">

                <option value="pendiente">
                    Pendiente
                </option>

                <option value="en progreso">
                    En Progreso
                </option>

                <option value="completada">
                    Completada
                </option>

            </select>

            <select id="prioridad" class="form-control mb-3">

                <option value="alta">
                    Alta
                </option>

                <option value="media">
                    Media
                </option>

                <option value="baja">
                    Baja
                </option>

            </select>

            <input type="text" id="usuario" class="form-control mb-3" placeholder="Responsable">

            <button class="btn btn-success" id="btnGuardarTarea">

                Guardar Tarea

            </button>

        </div>

        <hr>

        <table class="table table-bordered">

            <thead>

                <tr>

                    <th>Título</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Prioridad</th>
                    <th>Usuario</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody id="listaTareas">

            </tbody>

        </table>

    </div>

    <script type="module" src="js/tareas.js"></script>

</body>

</html>
